[project]
name = "cmc-diploma"
version = "0.1.0"
description = "Tensor Parallel & FSDP verification of neural networks (Alpha-Beta-CROWN)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.8.0,<2.9.0",
    "torchvision>=0.23.0,<0.24.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.15",
    "onnxoptimizer>=0.3",
    "onnx2pytorch @ git+https://github.com/Verified-Intelligence/onnx2pytorch@fe7281b9b6c8c28f61e72b8f3b0e3181067c7399",
    "skl2onnx>=1.14",
    "gurobipy>=10",
    "psutil>=5.9.5",
    "pyyaml>=6.0",
    "sortedcontainers>=2.4",
    "pandas>=2.0",
    "termcolor>=2.3.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "tqdm>=4.60",
    "packaging>=23.0",
    "appdirs>=1.4",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-order>=1.3",
    "pylint>=3.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
name = "pytorch-cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
